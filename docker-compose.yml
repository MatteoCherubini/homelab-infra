# ╔══════════════════════════════════════════════════════════════╗
# ║              HOMELAB – Docker Compose Root                  ║
# ║                                                              ║
# ║  Per disabilitare uno stack: commenta la riga include.       ║
# ║                                                              ║
# ║  Uso:                                                        ║
# ║    docker compose up -d              (tutto)                 ║
# ║    docker compose up -d nextcloud    (singolo servizio)      ║
# ╚══════════════════════════════════════════════════════════════╝

include:
  - stacks/core/compose.yml
  - stacks/ai/compose.yml
  - stacks/automation/compose.yml
  - stacks/git/compose.yml
  - stacks/tools/compose.yml
  - stacks/security/compose.yml
  # - stacks/ups/compose.yml    # Abilitare dopo setup fisico UPS

networks:
  homelab:
    driver: bridge
    ipam:
      config:
        - subnet: ${HOMELAB_SUBNET:-172.20.0.0/16}

volumes:
  n8n_known_hosts:
