# ╔══════════════════════════════════════════════════════════════╗
# ║              HOMELAB – Docker Compose Root                  ║
# ║                                                              ║
# ║  To disable a stack: comment out its include line.           ║
# ║                                                              ║
# ║  Usage:                                                      ║
# ║    docker compose up -d              (everything)            ║
# ║    docker compose up -d forgejo      (a single service)      ║
# ╚══════════════════════════════════════════════════════════════╝

include:
  - stacks/core/compose.yml
  - stacks/ai/compose.yml
  - stacks/automation/compose.yml
  - stacks/git/compose.yml
  - stacks/tools/compose.yml
  - stacks/security/compose.yml
  # - stacks/ups/compose.yml    # Enable once the UPS is physically installed

networks:
  homelab:
    driver: bridge
    ipam:
      config:
        - subnet: ${HOMELAB_SUBNET:-172.20.0.0/16}

volumes:
  n8n_known_hosts:
