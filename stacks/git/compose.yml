# -- GIT: Forgejo --
services:
  forgejo:
    image: ${FORGEJO_IMAGE}:${FORGEJO_VERSION}
    restart: unless-stopped
    ports:
      - "${FORGEJO_HTTP_PORT:-3001}:3000"
      - "${FORGEJO_SSH_PORT:-222}:22"
    volumes:
      - ${MEDIA_ROOT}/forgejo/data:/data
    environment:
      USER_UID: "${PUID:-1000}"
      USER_GID: "${PGID:-1000}"
      # Public hostname: it belongs in .env, not here. A committed compose
      # file carrying the real domain is unusable by anyone else, and in a
      # public repository it publishes that domain.
      FORGEJO__server__ROOT_URL: "https://${FORGEJO_DOMAIN}/"
      FORGEJO__server__DOMAIN: "${FORGEJO_DOMAIN}"
      FORGEJO__server__SSH_DOMAIN: "${FORGEJO_DOMAIN}"
      FORGEJO__server__SSH_PORT: "22"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "n8n,172.20.0.0/16,10.0.0.0/8"
    networks:
      - homelab
