# -- GIT: Forgejo --
services:
  forgejo:
    image: ${FORGEJO_IMAGE}:${FORGEJO_VERSION}
    restart: unless-stopped
    ports:
      - "${FORGEJO_HTTP_PORT:-3001}:3000"
      - "${FORGEJO_SSH_PORT:-222}:22"
    volumes:
      - ${MEDIA_ROOT}/forgejo/data:/data
    environment:
      USER_UID: "${PUID:-1000}"
      USER_GID: "${PGID:-1000}"
      FORGEJO__server__ROOT_URL: "https://git.example.org/"
      FORGEJO__server__DOMAIN: "git.example.org"
      FORGEJO__server__SSH_DOMAIN: "git.example.org"
      FORGEJO__server__SSH_PORT: "22"
    networks:
      - homelab
