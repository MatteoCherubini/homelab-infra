# ── MONITORING: Netdata, Grafana, Loki, Promtail ──
#
# PREREQUISITO: dopo init.sh, esegui:
#   sudo chown -R 10001:10001 $DATA_ROOT/loki/data
#   (Loki gira come UID 10001 nel container)

services:

  netdata:
    image: ${NETDATA_IMAGE}:${NETDATA_VERSION}
    restart: unless-stopped
    ports:
      - "${NETDATA_PORT:-19999}:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${DATA_ROOT}/netdata/config:/etc/netdata
      - ${DATA_ROOT}/netdata/lib:/var/lib/netdata
      - ${DATA_ROOT}/netdata/cache:/var/cache/netdata
      - /etc/os-release:/host/etc/os-release:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  loki:
    image: ${LOKI_IMAGE}:${LOKI_VERSION}
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "3100:3100"
    volumes:
      - ${DATA_ROOT}/loki/data:/loki
      - ${DATA_ROOT}/loki/config/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - homelab

  promtail:
    image: ${PROMTAIL_IMAGE}:${PROMTAIL_VERSION}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/promtail/config/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - homelab

  grafana:
    image: ${GRAFANA_IMAGE}:${GRAFANA_VERSION}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - ${DATA_ROOT}/grafana/data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      TZ: ${TZ}
    networks:
      - homelab
