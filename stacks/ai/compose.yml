# ── AI: Ollama (GPU-only, dedicato alla GTX 1660 Super) ──

services:
  ollama:
    image: ${OLLAMA_IMAGE}:${OLLAMA_VERSION}
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      homelab:
        aliases:
          - ollama
