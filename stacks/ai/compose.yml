# ── AI: Ollama + Open WebUI ──
#
# GPU: Se hai una NVIDIA GPU, imposta OLLAMA_GPU_ENABLED=true nel .env
#      e usa il profilo gpu: docker compose --profile gpu up -d
#
# CPU only (default): docker compose up -d

services:

  ollama:
    image: ollama/ollama:0.6.2
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    networks:
      - homelab

  ollama-gpu:
    image: ollama/ollama:0.6.2
    restart: unless-stopped
    profiles:
      - gpu
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - homelab

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.6.6
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-8090}:8080"
    volumes:
      - ${DATA_ROOT}/open-webui/data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - homelab
