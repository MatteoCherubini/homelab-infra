# ── AI: Ollama + Open WebUI ──
# GPU: OLLAMA_GPU_ENABLED=true nel .env + docker compose --profile gpu up -d

services:

  ollama:
    image: ollama/ollama:0.21.0
    restart: unless-stopped
    profiles:
      - cpu
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    networks:
      - homelab

  ollama-gpu:
    image: ollama/ollama:0.21.0
    restart: unless-stopped
    profiles:
      - gpu
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      homelab:
        aliases:
          - ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.8.12
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-8090}:8080"
    volumes:
      - ${DATA_ROOT}/open-webui/data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
    networks:
      - homelab
