# ── AI: Ollama, on a dedicated NVIDIA GPU ──
# docs/stacks/ai.md

services:
  ollama:
    image: ${OLLAMA_IMAGE}:${OLLAMA_VERSION}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
    # Loopback only: n8n reaches it on the Docker network as ollama:11434, and
    # nothing on the LAN has a reason to. docs/stacks/ai.md
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ${DATA_ROOT}/ollama/data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      homelab:
        aliases:
          - ollama
