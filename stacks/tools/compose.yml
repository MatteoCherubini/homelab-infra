# ── TOOLS: ntfy, Excalidraw ──

services:

  ntfy:
    image: ${NTFY_IMAGE}:${NTFY_VERSION}
    restart: unless-stopped
    ports:
      - "${NTFY_PORT:-8091}:80"
    volumes:
      - ${DATA_ROOT}/ntfy/data:/var/lib/ntfy
    command: serve
    networks:
      - homelab

  excalidraw:
    image: ${EXCALIDRAW_IMAGE}:${EXCALIDRAW_VERSION}
    restart: unless-stopped
    ports:
      - "${EXCALIDRAW_PORT:-8092}:80"
    networks:
      - homelab
