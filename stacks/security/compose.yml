# ── SECURITY: Vaultwarden ────────────────────────────────────────────────────
services:
  vaultwarden:
    image: ${VAULTWARDEN_IMAGE}:${VAULTWARDEN_VERSION}
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "${VAULTWARDEN_PORT:-8096}:80"
    volumes:
      - ${DATA_ROOT}/vaultwarden/data:/data
    environment:
      # Dominio principale, necessario a HTTPS e WebAuthn. Dal .env: WebAuthn
      # lega le passkey a questo valore esatto, quindi è per-installazione.
      DOMAIN: "https://${VAULTWARDEN_DOMAIN}/"

      # User registrations (Keep this set to 'false' in production)
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      INVITATIONS_ALLOWED: "${VAULTWARDEN_INVITATIONS_ALLOWED:-true}"

      # Pannello di amministrazione. Il default vuoto è deliberato: senza un
      # token Vaultwarden disabilita il pannello, ed è così che questa
      # installazione vuole stare a regime. Il `:-` serve a dirlo in modo
      # esplicito — senza, Compose emette un warning a ogni comando per una
      # variabile che si è scelto di non impostare.
      # Per abilitarlo: valorizzare VAULTWARDEN_ADMIN_TOKEN nel .env con un
      # hash Argon2 (`vaultwarden hash`), non con testo in chiaro.
      ADMIN_TOKEN: "${VAULTWARDEN_ADMIN_TOKEN:-}"

      # Security and brute-force protection
      LOGIN_RATELIMIT_MAX_BURST: "5"
      LOGIN_RATELIMIT_SECONDS: "300"
      ADMIN_RATELIMIT_MAX_BURST: "3"
      ADMIN_RATELIMIT_SECONDS: "300"

      # SMTP config (Gmail)
      SMTP_HOST: "${VAULTWARDEN_SMTP_HOST}"
      SMTP_PORT: "${VAULTWARDEN_SMTP_PORT:-587}"
      SMTP_SECURITY: "${VAULTWARDEN_SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${VAULTWARDEN_SMTP_USER}"
      SMTP_PASSWORD: "${VAULTWARDEN_SMTP_PASS}"
      SMTP_FROM: "${VAULTWARDEN_SMTP_FROM}"
      SMTP_FROM_NAME: "Homelab Vaultwarden"

      # General settings
      TZ: "${TZ}"
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: "warn"
    networks:
      - homelab
