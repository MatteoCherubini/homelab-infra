# ── DOCS: Paperless-ngx + PostgreSQL + Redis ──

services:

  paperless-db:
    image: ${NEXTCLOUD_DB_IMAGE}:${NEXTCLOUD_DB_VERSION}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/paperless/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_NAME}
      POSTGRES_USER: ${PAPERLESS_DB_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAPERLESS_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless-redis:
    image: ${NEXTCLOUD_REDIS_IMAGE}:${NEXTCLOUD_REDIS_VERSION}
    restart: unless-stopped
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless:
    image: ${PAPERLESS_IMAGE}:${PAPERLESS_VERSION}
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
    ports:
      - "${PAPERLESS_PORT:-8089}:8000"
    volumes:
      - ${DATA_ROOT}/paperless/data:/usr/src/paperless/data
      - ${MEDIA_ROOT}/paperless/media:/usr/src/paperless/media
      - ${MEDIA_ROOT}/paperless/export:/usr/src/paperless/export
      - ${MEDIA_ROOT}/paperless/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_NAME}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_TIME_ZONE: ${TZ}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-ita+eng}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
    networks:
      - homelab
