# ── UPS: NUT (Network UPS Tools) ──
# Full runbook, and why the host-side design is the one that works:
# docs/stacks/ups.md
# Enable after connecting the UPS to the server over USB.
# Then uncomment the include line in the root docker-compose.yml.

services:

  nut-server:
    image: instantlinux/nut-upsd:latest
    restart: unless-stopped
    ports:
      - "${NUT_PORT:-3493}:3493"
    volumes:
      - ${DATA_ROOT}/nut/etc:/etc/nut
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    environment:
      API_USER: upsmon
      API_PASSWORD: ${NUT_API_PASSWORD:-changeme}
    networks:
      - homelab
