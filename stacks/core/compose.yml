# ── CORE: Nginx Proxy Manager, Homepage, Cloudflared ──

services:
  nginx:
    image: ${NGINX_IMAGE}:${NGINX_VERSION}
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_ADMIN_PORT:-81}:81"
    volumes:
      - ${DATA_ROOT}/nginx/data:/data
      - ${DATA_ROOT}/nginx/letsencrypt:/etc/letsencrypt
    networks:
      - homelab

  homepage:
    image: ${HOMEPAGE_IMAGE}:${HOMEPAGE_VERSION}
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    volumes:
      - ${DATA_ROOT}/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:-*}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [utility]
    networks:
      - homelab

  cloudflared:
    image: ${CLOUDFLARED_IMAGE}:${CLOUDFLARED_VERSION}
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - homelab

  # ─── Push notifications ──────────────────────────────────────────────────────
  ntfy:
    container_name: ntfy
    image: ${NTFY_IMAGE}:${NTFY_VERSION}
    restart: unless-stopped
    ports:
      - "${NTFY_PORT:-8091}:80"
    volumes:
      - ${DATA_ROOT}/ntfy/data:/var/lib/ntfy
    command: serve
    environment:
      NTFY_BEHIND_PROXY: "true"
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
    networks:
      - homelab
