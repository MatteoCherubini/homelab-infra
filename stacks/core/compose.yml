# ── CORE: Nginx Proxy Manager, Headscale, Portainer, Homepage ──

services:

  nginx:
    image: jc21/nginx-proxy-manager:2.14.0
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "${NGINX_ADMIN_PORT:-81}:81"
    volumes:
      - ${DATA_ROOT}/nginx/data:/data
      - ${DATA_ROOT}/nginx/letsencrypt:/etc/letsencrypt
    networks:
      - homelab

  headscale:
    image: headscale/headscale:0.25
    restart: unless-stopped
    command: serve
    volumes:
      - ${DATA_ROOT}/headscale/config:/etc/headscale
      - ${DATA_ROOT}/headscale/data:/var/lib/headscale
    ports:
      - "${HEADSCALE_PORT:-8085}:8080"
    networks:
      - homelab

  headscale-ui:
    image: ghcr.io/gurucomputing/headscale-ui:2025.01.20
    restart: unless-stopped
    ports:
      - "${HEADSCALE_UI_PORT:-8086}:80"
    networks:
      - homelab

  portainer:
    image: portainer/portainer-ce:2.25.1
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DATA_ROOT}/portainer:/data
    networks:
      - homelab

  homepage:
    image: ghcr.io/gethomepage/homepage:v0.10.9
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    volumes:
      - ${DATA_ROOT}/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      HOMEPAGE_ALLOWED_HOSTS: "${HOMEPAGE_ALLOWED_HOSTS:-*}"
    networks:
      - homelab
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - homelab
