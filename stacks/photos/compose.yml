# ── PHOTOS: Immich v2 + PostgreSQL + Redis + ML ──
# Immich v2 è la prima release stabile

services:

  immich-db:
    image: tensorchord/pgvecto-rs:pg16-v0.4.0
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/immich/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_USER: ${IMMICH_DB_USER}
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USER} -d ${IMMICH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich-server:
    image: ghcr.io/immich-app/immich-server:v2.7.5
    restart: unless-stopped
    depends_on:
      immich-db:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - ${MEDIA_ROOT}/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      DB_HOSTNAME: immich-db
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}
      DB_USERNAME: ${IMMICH_DB_USER}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      REDIS_HOSTNAME: immich-redis
    networks:
      - homelab

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.5
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/immich/ml-cache:/cache
    networks:
      - homelab
