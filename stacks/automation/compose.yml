# ── AUTOMATION: n8n (queue mode) + worker + PostgreSQL 18 + Redis 8 + Syncthing
#
# Why the anchor below exists, how n8n reaches Syncthing, and the upgrade
# procedure: docs/stacks/automation.md
# Ref: https://docs.n8n.io/2-0-breaking-changes/
# ──────────────────────────────────────────────────────────────────────────────

# Merged into BOTH n8n and n8n-worker. In queue mode the worker executes the
# nodes, so a variable set on only one of them resolves to an empty string at
# run time while looking correct in the editor.
x-kg-env: &kg-env
  # SSH aliases, resolved in n8n-runner's ~/.ssh/config ON THIS HOST — not names
  # n8n resolves itself: the path is two hops, n8n → n8n-runner@this-host →
  # ssh $KG_AI_HOST.
  KG_AI_HOST: ${KG_AI_HOST}
  KG_HYPERVISOR_HOST: ${KG_HYPERVISOR_HOST}
  # Unix account owning the genome vaults, reached with sudo -u by the watcher.
  KG_SERVICE_USER: ${KG_SERVICE_USER}
  # CONTAINER ADDRESS, not the public hostname. `forgejo` is in
  # N8N_SSRF_ALLOWED_HOSTNAMES and the public hostname is not; and this way the
  # call never leaves the machine, so it keeps working with the tunnel down.
  FORGEJO_URL: ${FORGEJO_URL}
  # The address a PERSON reaches — never the same value as FORGEJO_URL above.
  # Notifications build their tap target from this; unset, they emit no link
  # and name the key in the message instead.
  FORGEJO_WEB_BASE: ${FORGEJO_WEB_BASE}
  KG_NTFY_URL: ${KG_NTFY_URL}
  KG_NTFY_TOPIC: ${KG_NTFY_TOPIC}
  # AUTHORISATION list: who may start a phase by merging.
  # Empty means nobody — it fails closed on purpose.
  KG_ALLOWED_SENDERS: ${KG_ALLOWED_SENDERS}
  # No KG_*_WEBHOOK_PATH here, deliberately: a Webhook node's `path` is read at
  # activation time and cannot come from the environment. See the stack doc.
  KG_IDLE_MINUTES: ${KG_IDLE_MINUTES:-30}

services:
  n8n-db:
    image: ${N8N_DB_IMAGE}:${N8N_DB_VERSION}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/n8n/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  n8n-redis:
    image: ${N8N_REDIS_IMAGE}:${N8N_REDIS_VERSION}
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ${DATA_ROOT}/n8n/redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
      - n8n_known_hosts:/home/node/.ssh
    environment:
      # ── Knowledge Genome ──────────────────────────────────────────────────
      <<: *kg-env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue / Worker ────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      TORRE_MAC: ${TORRE_MAC}
      # ── Syncthing ─────────────────────────────────────────────────────────
      SYNCTHING_URL: ${SYNCTHING_URL}
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY}
      # ── Sicurezza SSRF ────────────────────────────────────────────────────
      N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED}
      N8N_SSRF_BLOCKED_IP_RANGES: ${N8N_SSRF_BLOCKED_IP_RANGES}
      N8N_SSRF_ALLOWED_HOSTNAMES: ${N8N_SSRF_ALLOWED_HOSTNAMES}
      # ── Webhook HMAC ──────────────────────────────────────────────────────
      N8N_WEBHOOK_HMAC_SECRET: ${N8N_WEBHOOK_HMAC_SECRET}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # ── Performance / Storage ─────────────────────────────────────────────
      NODE_OPTIONS: --max-old-space-size=1024
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_BINARY_DATA_STORAGE: filesystem
      GENERIC_TIMEZONE: ${TZ}
    networks:
      - homelab

  n8n-worker:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    command: worker
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n:
        condition: service_started
      n8n-redis:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
    environment:
      # ── Knowledge Genome ──────────────────────────────────────────────────
      # Same anchor as the `n8n` service, and it matters more here: in queue
      # mode THIS is the process that executes nodes and resolves the $env.
      <<: *kg-env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue ─────────────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      GENERIC_TIMEZONE: ${TZ}
      TORRE_MAC: ${TORRE_MAC}
      # ── Syncthing ─────────────────────────────────────────────────────────
      SYNCTHING_URL: ${SYNCTHING_URL}
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY}
    networks:
      - homelab

  # ── SYNCTHING: file ingress, driven by n8n over its REST API ──────────
  # Reachability, exposure and volume layout: docs/stacks/automation.md
  syncthing:
    image: ${SYNCTHING_IMAGE}:${SYNCTHING_VERSION}
    restart: unless-stopped
    hostname: nexus-syncthing
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      # API/GUI on the entire container network (for n8n via Docker DNS)
      STGUIADDRESS: 0.0.0.0:8384
      # no default ~/Sync folder: folders are created via API (n8n control plane)
      STNODEFAULTFOLDER: "true"
    volumes:
      # Entire Syncthing home directory (config + SQLite index DB): v2 does not write
      # only to the /config subpath, so the whole /var/syncthing is mounted as per
      # the official guide (README-Docker.md). config.xml will reside under this directory.
      - ${DATA_ROOT}/syncthing:/var/syncthing
      # genome working tree (checkout + private staging area), IDENTICAL host↔container path
      # so the SSH-based commit job on nexus and Syncthing see the same path
      - ${GENOME_VAULTS_ROOT:-/srv/genome-vaults}:${GENOME_VAULTS_ROOT:-/srv/genome-vaults}
    ports:
      # GUI/API: host loopback only (admin). n8n uses the internal Docker network.
      - "127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384"
      # data sync (LAN): TCP + QUIC (UDP)
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
      # local discovery (LAN)
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    networks:
      - homelab
    healthcheck:
      # official form (the image includes curl); unauthenticated endpoint
      test:
        [
          "CMD-SHELL",
          "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o OK || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
