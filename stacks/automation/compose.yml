# ── AUTOMATION: n8n v2 + Worker + PostgreSQL 18 + Redis 8 ──────────────────
#
# Ref: https://docs.n8n.io/2-0-breaking-changes/
# ──────────────────────────────────────────────────────────────────────────────

services:
  n8n-db:
    image: ${N8N_DB_IMAGE}:${N8N_DB_VERSION}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/n8n/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  n8n-redis:
    image: ${N8N_REDIS_IMAGE}:${N8N_REDIS_VERSION}
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ${DATA_ROOT}/n8n/redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
      - n8n_known_hosts:/home/node/.ssh
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue / Worker ────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      TORRE_MAC: ${TORRE_MAC}
      # ── Sicurezza SSRF ────────────────────────────────────────────────────
      N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED}
      N8N_SSRF_BLOCKED_IP_RANGES: ${N8N_SSRF_BLOCKED_IP_RANGES}
      N8N_SSRF_ALLOWED_HOSTNAMES: ${N8N_SSRF_ALLOWED_HOSTNAMES}
      # ── Webhook HMAC ──────────────────────────────────────────────────────
      N8N_WEBHOOK_HMAC_SECRET: ${N8N_WEBHOOK_HMAC_SECRET}
      # ── Performance / Storage ─────────────────────────────────────────────
      NODE_OPTIONS: --max-old-space-size=1024
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_BINARY_DATA_STORAGE: filesystem
      GENERIC_TIMEZONE: ${TZ}
    networks:
      - homelab

  n8n-worker:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    command: worker
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n:
        condition: service_started
      n8n-redis:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
    environment:
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue ─────────────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      GENERIC_TIMEZONE: ${TZ}
      TORRE_MAC: ${TORRE_MAC}
    networks:
      - homelab
