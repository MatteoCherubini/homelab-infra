# ── AUTOMATION: n8n v2 + Worker + PostgreSQL 18 + Redis 8 + Syncthing ─────────
#
# Ref: https://docs.n8n.io/2-0-breaking-changes/
# ──────────────────────────────────────────────────────────────────────────────

services:
  n8n-db:
    image: ${N8N_DB_IMAGE}:${N8N_DB_VERSION}
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/n8n/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${N8N_DB_NAME}
      POSTGRES_USER: ${N8N_DB_USER}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  n8n-redis:
    image: ${N8N_REDIS_IMAGE}:${N8N_REDIS_VERSION}
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - ${DATA_ROOT}/n8n/redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n-db:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
      - n8n_known_hosts:/home/node/.ssh
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue / Worker ────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      TORRE_MAC: ${TORRE_MAC}
      # ── Syncthing ─────────────────────────────────────────────────────────
      SYNCTHING_URL: ${SYNCTHING_URL}
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY}
      # ── Sicurezza SSRF ────────────────────────────────────────────────────
      N8N_SSRF_PROTECTION_ENABLED: ${N8N_SSRF_PROTECTION_ENABLED}
      N8N_SSRF_BLOCKED_IP_RANGES: ${N8N_SSRF_BLOCKED_IP_RANGES}
      N8N_SSRF_ALLOWED_HOSTNAMES: ${N8N_SSRF_ALLOWED_HOSTNAMES}
      # ── Webhook HMAC ──────────────────────────────────────────────────────
      N8N_WEBHOOK_HMAC_SECRET: ${N8N_WEBHOOK_HMAC_SECRET}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      # ── Performance / Storage ─────────────────────────────────────────────
      NODE_OPTIONS: --max-old-space-size=1024
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_BINARY_DATA_STORAGE: filesystem
      GENERIC_TIMEZONE: ${TZ}
    networks:
      - homelab

  n8n-worker:
    image: ${N8N_IMAGE}:${N8N_VERSION}
    restart: unless-stopped
    command: worker
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      n8n:
        condition: service_started
      n8n-redis:
        condition: service_healthy
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # ── Database ──────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME}
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # ── Queue ─────────────────────────────────────────────────────────────
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      # ── Encryption ────────────────────────────────────────────────────────
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      GENERIC_TIMEZONE: ${TZ}
      TORRE_MAC: ${TORRE_MAC}
    networks:
      - homelab

  # ── SYNCTHING: raw ingress (Obsidian → nexus) — Knowledge Genome ──────
  #
  # Lives alongside n8n because they work as a pair: n8n queries the REST API of
  # Syncthing to detect modified raws, map them to the collaborator, and
  # commit them.
  #
  # Reachability n8n → Syncthing:
  #   - STGUIADDRESS=0.0.0.0:8384 makes the API listen on the entire network of
  #     the container, so n8n (same 'homelab' network) can call it via
  #     http://syncthing:8384 with the X-API-Key header. NB: add 'syncthing'
  #     to N8N_SSRF_ALLOWED_HOSTNAMES in the .env file, otherwise SSRF protection will block it.
  #   - Port 8384 is published ONLY on the host's 127.0.0.1 (human admin);
  #     it is not exposed on the LAN.
  # Sync ports (22000 tcp/udp, 21027/udp discovery) are published on the LAN for peers
  # (laptops, phones). LAN-only tuning (no global discovery/relay) is configured
  # in the GUI or via config after the first startup.
  # ──────────────────────────────────────────────────────────────────────────────
  syncthing:
    image: ${SYNCTHING_IMAGE}:${SYNCTHING_VERSION}
    restart: unless-stopped
    hostname: nexus-syncthing
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ}
      # API/GUI on the entire container network (for n8n via Docker DNS)
      STGUIADDRESS: 0.0.0.0:8384
      # no default ~/Sync folder: folders are created via API (n8n control plane)
      STNODEFAULTFOLDER: "true"
    volumes:
      # Entire Syncthing home directory (config + SQLite index DB): v2 does not write
      # only to the /config subpath, so the whole /var/syncthing is mounted as per
      # the official guide (README-Docker.md). config.xml will reside under this directory.
      - ${DATA_ROOT}/syncthing:/var/syncthing
      # genome working tree (checkout + private staging area), IDENTICAL host↔container path
      # so the SSH-based commit job on nexus and Syncthing see the same path
      - ${GENOME_VAULTS_ROOT:-/srv/genome-vaults}:${GENOME_VAULTS_ROOT:-/srv/genome-vaults}
    ports:
      # GUI/API: host loopback only (admin). n8n uses the internal Docker network.
      - "127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384"
      # data sync (LAN): TCP + QUIC (UDP)
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
      # local discovery (LAN)
      - "${SYNCTHING_DISCOVERY_PORT:-21027}:21027/udp"
    networks:
      - homelab
    healthcheck:
      # official form (the image includes curl); unauthenticated endpoint
      test:
        [
          "CMD-SHELL",
          "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o OK || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
